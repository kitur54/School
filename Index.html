            renderCurrentView();
            showToast(`Switched view mode to ${role.toUpperCase()}`);

        function renderNav() {
            const nav = document.getElementById('nav-links');

                { id: 'calendar', label: 'School Calendar', icon: 'fa-calendar-days' },
                { id: 'resources', label: 'Resource Library', icon: 'fa-folder-open' }

            let roleLinks = [];
            if (role === 'student') {
                roleLinks = [
                    { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                    { id: 'assignments', label: 'Assignments', icon: 'fa-list-check' },
                    { id: 'timetable', label: 'Timetable', icon: 'fa-clock' },
                    { id: 'gradebook', label: 'Gradebook', icon: 'fa-graduation-cap' }

                roleLinks = [

                    { id: 'roster', label: 'Class Roster', icon: 'fa-users' },
                    { id: 'grade-management', label: 'Grading Queue', icon: 'fa-pen-to-square' }
                ];
            } else if (role === 'parent') {
                roleLinks = [
                    { id: 'dashboard', label: 'Child Overview', icon: 'fa-child-reaching' },
                    { id: 'messages', label: 'Teacher Messaging', icon: 'fa-comments' }

                    { id: 'dashboard', label: 'System Overview', icon: 'fa-sliders' },
                    { id: 'users-management', label: 'User Directory', icon: 'fa-user-gear' }
                ];
            }

            const allLinks = [...roleLinks, ...commonLinks];

            nav.innerHTML = allLinks.map(link => {

                return `
                    <button onclick="switchTab('${link.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
                        isActive 
                        ? 'bg-cyan-600 text-white shadow-md shadow-cyan-600/30' 
                        : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }">
                        <i class="fa-solid ${link.icon} w-5 text-center text-base ${isActive ? 'text-white' : 'text-slate-400'}"></i>
                        <span>${link.label}</span>
                    </button>
                `;
            }).join('');

        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-xl text-sm font-medium text-white flex items-center space-x-3 transition-all duration-300 transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600' : 'bg-slate-800 dark:bg-slate-700'
            }`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

                renderCalendarView(main);

        function filterAssignments() {
            const query = (document.getElementById('assignment-search')?.value || '').toLowerCase();

            const filtered = PORTAL_DATA.assignments.filter(a => 
                a.title.toLowerCase().includes(query) || a.subject.toLowerCase().includes(query)
            );

            wrapper.innerHTML = `
                <table class="w-full text-left border-collapse">

                            <th class="p-4">Due Date</th>

                                <td class="p-4 text-slate-500 dark:text-slate-400">${a.dueDate}</td>
                                <td class="p-4 text-slate-500 dark:text-slate-400">${a.weight}</td>
                                <td class="p-4">
                                    <span class="px-2.5 py-1 text-xs rounded-full font-medium ${
                                        a.status === 'Submitted' ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400' :
                                        a.status === 'Graded' ? 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400' :
                                        'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'
                                    }">${a.status} ${a.score ? `(${a.score})` : ''}</span>
                                </td>

                                    ${a.status === 'Pending' ? `

        function submitHomework(id) {
            const assignment = PORTAL_DATA.assignments.find(a => a.id === id);

        function initStudentCharts() {
            // Chart 1: Grades Breakdown Chart
            const gradesCtx = document.getElementById('gradesChart')?.getContext('2d');
            if (gradesCtx) {
                if (gradesChartInstance) gradesChartInstance.destroy();
                gradesChartInstance = new Chart(gradesCtx, {
                    type: 'bar',
                    data: {
                        labels: PORTAL_DATA.courses.map(c => c.name),

                        }]
                    },
                    options: {

                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { min: 60, max: 100, grid: { color: 'rgba(148, 163, 184, 0.1)' } },
                            x: { grid: { display: false } }
                        }
                    }

        function toggleNotifications() {
            const dropdown = document.getElementById('notif-dropdown');
            dropdown.classList.toggle('hidden');
        }

        function renderNotifications() {
            const list = document.getElementById('notif-list');
            const badge = document.getElementById('notif-badge');
            const unreadCount = PORTAL_DATA.notifications.filter(n => !n.read).length;

            if (unreadCount === 0) badge.classList.add('hidden');
            else badge.classList.remove('hidden');

            list.innerHTML = PORTAL_DATA.notifications.map(n => `
                <div class="p-3 hover:bg-slate-50 dark:hover:bg-slate-700/40 transition-colors ${!n.read ? 'bg-cyan-500/5' : ''}">
                    <div class="flex justify-between items-start">
                        <p class="text-xs font-bold text-slate-800 dark:text-slate-200">${n.title}</p>
                        <span class="text-[10px] text-slate-400">${n.time}</span>
                    </div>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">${n.desc}</p>
                </div>
            `).join('');
        }

        function markAllNotificationsRead() {
            PORTAL_DATA.notifications.forEach(n => n.read = true);
            renderNotifications();
            showToast('Notifications marked as read');
        }

        // Window Load Event Trigger
        window.onload = function() {
            initApp();
        };
    </script>
